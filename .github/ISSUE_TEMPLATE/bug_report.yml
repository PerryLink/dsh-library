name: Bug report
description: Report a bug in dsh-library
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the fields below so we can reproduce it.
  - type: input
    id: package-version
    attributes:
      label: Package version
      description: The `dsh-library` version you are running.
      placeholder: "0.1.4"
    validations:
      required: true
  - type: input
    id: harness-version
    attributes:
      label: Harness version
      description: The DeepSeek Harness (`dsh`) version you are running.
      placeholder: "0.1.1-rc.2"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS / Node version
      description: Operating system and Node.js version (`node -v`).
      placeholder: "e.g. Windows 11, Node v24.0.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, ordered steps that reproduce the bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste any relevant logs or output.

        > **⚠️ Redact sensitive data before pasting — never include tokens, API keys, secrets, or Authorization/request headers.**
      render: shell
    validations:
      required: false
